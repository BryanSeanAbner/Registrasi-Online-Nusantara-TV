services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: "${PHP_IMAGE:-public.ecr.aws/docker/library/php:8.2-fpm}"
        COMPOSER_IMAGE: "${COMPOSER_IMAGE:-public.ecr.aws/docker/library/composer:2}"
    image: registrasi-online-php
    container_name: registrasi-online-app
    restart: unless-stopped
    working_dir: /www/registrasi-online
    volumes:
      - ./:/www/registrasi-online
      - vendor:/www/registrasi-online/vendor
      - node_modules:/www/registrasi-online/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      FORCE_HTTPS: "true"
      # Prevent automatic composer install/migrations on restart
      COMPOSER_INSTALL_ON_START: "never"
      MIGRATE_ON_START: "false"
      # Do not run queue worker inside app container (use service `queue`)
      QUEUE_WORKER_IN_APP: "false"
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.25-alpine}
    container_name: registrasi-online-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/www/registrasi-online:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.0}
    container_name: registrasi-online-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: queue worker (uses same app image)
  queue:
    image: registrasi-online-php
    container_name: registrasi-online-queue
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    working_dir: /www/registrasi-online
    volumes:
      - ./:/www/registrasi-online
      - vendor:/www/registrasi-online/vendor
    environment:
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    command: ["php", "artisan", "queue:work", "--tries=1", "--verbose", "--timeout=90"]

  # Public HTTPS tunnel using ngrok (exposes nginx:80)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: registrasi-online-ngrok
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: >-
      start --all --config /etc/ngrok.yml --log=stdout
    volumes:
      - ./docker/ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "4040:4040"

volumes:
  dbdata:
    name: registrasi-online-dbdata
  vendor:
    name: registrasi-online-vendor
  node_modules:
