version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: registrasi-online-php
    container_name: registrasi-online-app
    restart: unless-stopped
    working_dir: /www/registrasi-online
    volumes:
      - ./:/www/registrasi-online
      - vendor:/www/registrasi-online/vendor
      - node_modules:/www/registrasi-online/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: registrasi-online-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/www/registrasi-online:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    container_name: registrasi-online-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: filament_test
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: queue worker (uses same app image)
  queue:
    image: registrasi-online-php
    container_name: registrasi-online-queue
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    working_dir: /www/registrasi-online
    volumes:
      - ./:/www/registrasi-online
      - vendor:/www/registrasi-online/vendor
    command: ["php", "artisan", "queue:work", "--tries=1", "--verbose", "--timeout=90"]

  # Optional: vite for assets (uncomment to use dev server)
  # vite:
  #   image: node:20-alpine
  #   container_name: registrasi-online-vite
  #   working_dir: /var/www/html
  #   volumes:
  #     - ./:/var/www/html
  #     - node_modules:/var/www/html/node_modules
  #   command: sh -c "npm ci && npm run dev -- --host"
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - app

volumes:
  dbdata:
  vendor:
  node_modules:
