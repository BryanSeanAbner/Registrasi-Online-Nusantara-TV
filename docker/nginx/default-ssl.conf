server {
    listen 80;
    server_name event.nusantaratv.com;

    # Allow ACME HTTP-01 challenge over HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name event.nusantaratv.com;

    # Paths created by certbot with the domain below
    ssl_certificate /etc/letsencrypt/live/event.nusantaratv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/event.nusantaratv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/registrasi-online/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Keep ACME available on HTTPS too (helps with some setups)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ensure Livewire assets are handled by Laravel (not treated as static)
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|webp)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

