services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt

  # Certbot container used to obtain and renew Let's Encrypt certificates
  certbot:
    image: certbot/certbot:latest
    container_name: registrasi-online-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    # No command by default; run ad-hoc e.g. `certonly` or `renew`

volumes:
  certbot-www:
  certbot-etc:

